<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f6f3ee;--card:#fff;--ink:#1f2a27;--muted:#5f6b67;--line:#e3ddd3;--sage:#3f6b5c;--sage-d:#2f5246;--sage-l:#e6efeb;
    --amber:#b7791f;--amber-l:#fbf3e3;--red:#b23b3b;--red-l:#fbeaea;--r:14px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,-apple-system,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 120px}
  h1,h2{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
  h1{font-size:26px;line-height:1.2} h2{font-size:21px;margin-bottom:4px}
  .sub{color:var(--muted);margin:2px 0 16px;font-size:15px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
  .hidden{display:none!important}
  label.f{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
  .req{color:var(--red)}
  input,select,textarea{width:100%;font:inherit;font-size:16px;color:inherit;background:#fff;border:1px solid #cfc8bc;border-radius:12px;padding:13px 14px;outline:none;-webkit-appearance:none;appearance:none}
  select{background-image:linear-gradient(45deg,transparent 50%,#5f6b67 50%),linear-gradient(135deg,#5f6b67 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
  input:focus,select:focus,textarea:focus{border-color:var(--sage);box-shadow:0 0 0 3px var(--sage-l)}
  .invalid{border-color:var(--red)!important}
  .err{color:var(--red);font-size:14px;margin-top:6px}
  .hint{color:var(--muted);font-size:13.5px;margin-top:6px}
  .row{display:flex;gap:10px} .row>*{flex:1}
  .cc{flex:0 0 76px;display:flex;align-items:center;justify-content:center;background:#f3efe8;border:1px solid #cfc8bc;border-radius:12px;font-weight:600}
  .check{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fbfaf7;margin-top:12px;font-size:15px}
  .check input{width:22px;height:22px;flex:0 0 auto;margin-top:1px;accent-color:var(--sage);-webkit-appearance:auto;appearance:auto;padding:0}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font:inherit;font-weight:700;font-size:16px;border-radius:14px;padding:15px 18px;border:1px solid transparent;cursor:pointer;text-decoration:none;min-height:52px}
  .btn.primary{background:var(--sage);color:#fff} .btn.primary:active{background:var(--sage-d)}
  .btn.primary:disabled{background:#a9bdb5}
  .btn.ghost{background:#fff;border-color:#cfc8bc;color:var(--ink)}
  .btn.danger{background:var(--red);color:#fff}
  .btn.small{min-height:42px;padding:9px 14px;font-size:14.5px;border-radius:11px;width:auto}
  .btn+.btn{margin-top:10px}
  .link{background:none;border:none;color:var(--sage-d);text-decoration:underline;font:inherit;padding:0;cursor:pointer}
  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(246,243,238,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:5}
  .bar .inner{max-width:560px;margin:0 auto;display:flex;gap:10px}
  .bar .inner .btn{margin:0}
  .bar .inner .btn.ghost{flex:0 0 96px}
  .progress{display:flex;gap:6px;margin:4px 0 18px}
  .progress i{flex:1;height:5px;border-radius:9px;background:var(--line)} .progress i.on{background:var(--sage)}
  .choice{display:flex;gap:12px;align-items:center;padding:16px;border:2px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;margin-bottom:10px}
  .choice.sel{border-color:var(--sage);background:var(--sage-l)}
  .choice .ic{font-size:24px;width:34px;text-align:center}
  .choice b{display:block} .choice small{color:var(--muted)}
  .fee{display:flex;justify-content:space-between;align-items:center;padding:16px;border-radius:14px;background:var(--sage-l)}
  .fee .amt{font-family:Fraunces,serif;font-size:28px;font-weight:600}
  .pill{display:inline-block;font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--sage-l);color:var(--sage-d);font-weight:700}
  .pill.amber{background:var(--amber-l);color:var(--amber)} .pill.red{background:var(--red-l);color:var(--red)} .pill.grey{background:#eee;color:#555}
  .notice{border-left:4px solid var(--amber);background:var(--amber-l);padding:12px 14px;border-radius:10px;font-size:14.5px;margin-bottom:14px}
  .days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 8px;scroll-snap-type:x proximity}
  .days::-webkit-scrollbar{display:none}
  .day{flex:0 0 68px;text-align:center;border:2px solid var(--line);border-radius:14px;padding:8px 2px;background:#fff;cursor:pointer;scroll-snap-align:start}
  .day .dw{font-size:12px;color:var(--muted)} .day .dn{font-size:21px;font-family:Fraunces,serif;font-weight:600;line-height:1.2} .day .dm{font-size:11px;color:var(--muted)}
  .day .dc{font-size:11px;color:var(--sage);font-weight:600}
  .day.sel{border-color:var(--sage);background:var(--sage-l)}
  .day:disabled{opacity:.4;cursor:default}
  .slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .slot{border:2px solid #cfc8bc;background:#fff;border-radius:12px;padding:12px 6px;text-align:center;font:inherit;font-weight:600;cursor:pointer;min-height:54px}
  .slot.sel{background:var(--sage);border-color:var(--sage);color:#fff}
  .slot small{display:block;font-weight:400;font-size:12px;opacity:.8}
  .kv{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;font-size:15px}
  .kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
  .center{text-align:center}
  .big-tick{width:64px;height:64px;border-radius:50%;background:var(--sage);color:#fff;display:grid;place-items:center;font-size:32px;margin:8px auto 12px}
  .spinner{width:28px;height:28px;border:3px solid var(--sage-l);border-top-color:var(--sage);border-radius:50%;animation:sp 0.8s linear infinite;margin:24px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1f2a27;color:#fff;padding:12px 16px;border-radius:12px;font-size:14.5px;z-index:20;max-width:90%;box-shadow:0 6px 20px rgba(0,0,0,.2)}
  .sheet-bg{position:fixed;inset:0;background:rgba(20,25,23,.45);z-index:15;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
  .sheet .grab{width:44px;height:5px;border-radius:9px;background:#ddd;margin:-6px auto 14px}
  a{color:var(--sage-d)}
</style>
